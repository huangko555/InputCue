<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">InputCue 三套提示样式与四种输入状态</title><desc id="desc">三行四列展板。三行依次是描边、阴影与圆点；四列依次是中文、输入法英文、美式键盘与大写锁定。</desc>
  <defs><filter id="card-shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#52525B" flood-opacity=".22"/></filter><filter id="dot-shadow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#18181B" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="590" rx="28" fill="#F7F7F8"/><text x="56" y="61" fill="#18181B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">三套样式，四种状态</text><text x="56" y="91" fill="#71717A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">同一套语义，不同的视觉存在感</text>
  <g fill="#71717A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600"><text x="351" y="84" text-anchor="middle">中文</text><text x="582" y="84" text-anchor="middle">输入法英文</text><text x="813" y="84" text-anchor="middle">美式键盘</text><text x="1044" y="84" text-anchor="middle">大写锁定</text></g>
  <g stroke="#E4E4E7" fill="#FFFFFF"><rect x="238" y="112" width="226" height="126" rx="18"/><rect x="469" y="112" width="226" height="126" rx="18"/><rect x="700" y="112" width="226" height="126" rx="18"/><rect x="931" y="112" width="226" height="126" rx="18"/><rect x="238" y="252" width="226" height="126" rx="18"/><rect x="469" y="252" width="226" height="126" rx="18"/><rect x="700" y="252" width="226" height="126" rx="18"/><rect x="931" y="252" width="226" height="126" rx="18"/><rect x="238" y="392" width="226" height="126" rx="18"/><rect x="469" y="392" width="226" height="126" rx="18"/><rect x="700" y="392" width="226" height="126" rx="18"/><rect x="931" y="392" width="226" height="126" rx="18"/></g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="56" y="168" fill="#18181B" font-size="20" font-weight="700">描边</text><text x="56" y="193" fill="#71717A" font-size="14">清晰、醒目</text><text x="56" y="308" fill="#18181B" font-size="20" font-weight="700">阴影</text><text x="56" y="333" fill="#71717A" font-size="14">柔和、稳重</text><text x="56" y="448" fill="#18181B" font-size="20" font-weight="700">圆点</text><text x="56" y="473" fill="#71717A" font-size="14">极简、低打扰</text></g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="700" text-anchor="middle" fill="#09090B"><g transform="translate(319 140)"><rect x="6" y="6" width="58" height="58" fill="#09090B"/><rect width="58" height="58" fill="#FFFFFF" stroke="#09090B" stroke-width="4"/><text x="29" y="41" font-size="30">中</text></g><g transform="translate(553 140)"><rect x="6" y="6" width="58" height="58" fill="#09090B"/><rect width="58" height="58" fill="#FFFFFF" stroke="#09090B" stroke-width="4"/><text x="29" y="41" font-size="30">英</text></g><g transform="translate(784 140)"><rect x="6" y="6" width="58" height="58" fill="#09090B"/><rect width="58" height="58" fill="#FFFFFF" stroke="#09090B" stroke-width="4"/><text x="29" y="37" font-family="Segoe UI, sans-serif" font-size="18">ENG</text></g><g transform="translate(1015 140)"><rect x="6" y="6" width="58" height="58" fill="#09090B"/><rect width="58" height="58" fill="#FFFFFF" stroke="#09090B" stroke-width="4"/><text x="29" y="41" font-family="Segoe UI, sans-serif" font-size="30">A</text></g></g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="middle" fill="#52525B" filter="url(#card-shadow)"><g transform="translate(319 280)"><rect width="58" height="58" rx="2" fill="#FCFCFC" stroke="#D4D4D8"/><text x="29" y="41" font-size="30">中</text></g><g transform="translate(553 280)"><rect width="58" height="58" rx="2" fill="#FCFCFC" stroke="#D4D4D8"/><text x="29" y="41" font-size="30">英</text></g><g transform="translate(784 280)"><rect width="58" height="58" rx="2" fill="#FCFCFC" stroke="#D4D4D8"/><text x="29" y="37" font-family="Segoe UI, sans-serif" font-size="18">ENG</text></g><g transform="translate(1015 280)"><rect width="58" height="58" rx="2" fill="#FCFCFC" stroke="#D4D4D8"/><text x="29" y="41" font-family="Segoe UI, sans-serif" font-size="30">A</text></g></g>
  <g stroke="#FFFFFF" stroke-width="3" filter="url(#dot-shadow)"><circle cx="348" cy="455" r="14" fill="#E5534B"/><circle cx="582" cy="455" r="14" fill="#2F7FD6"/><circle cx="813" cy="455" r="14" fill="#D99000"/><circle cx="1044" cy="455" r="14" fill="#2F9E68"/></g><g fill="#A1A1AA" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle"><text x="348" y="492">#E5534B</text><text x="582" y="492">#2F7FD6</text><text x="813" y="492">#D99000</text><text x="1044" y="492">#2F9E68</text></g><text x="56" y="558" fill="#A1A1AA" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">颜色、尺寸、位置和显示时长均可在应用内调整</text>
</svg>
